openapi: 3.0.0
info:
  version: 1.0.0
  title: Health Tracker API
  description: This API provides endpoints for handling CRUD operations on the Health Tracker data.
  contact:
    name: your name
    email: studentnumber@setu.ie
paths:
  /api/users:
    get:
      summary: Get all users
      responses:
        200:
          description: This is a list of the users in the app
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: Add a user
      description: Add a user to the app
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        201:
          description: The user has been created

  /api/users/{user-id}:
    get:
      summary: Get a user by ID
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        200:
          description: This is a specific user in the app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        404:
          description: User not found
    patch:
      summary: Update a user by ID
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        200:
          description: The user has been updated
        404:
          description: User not found
    delete:
      summary: Delete a user by ID
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        204:
          description: The user has been deleted
        404:
          description: User not found

  /api/users/email/{email}:
    get:
      summary: Get a user by email
      parameters:
        - $ref: '#/components/parameters/EmailPath'
      responses:
        200:
          description: The user with the specified email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        404:
          description: User not found

  /api/users/{user-id}/activities:
    get:
      summary: Get all activities for a user
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        200:
          description: A list of activities for the specified user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activity'
        404:
          description: User not found
    delete:
      summary: Delete all activities for a user
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        204:
          description: All activities for the user have been deleted
        404:
          description: User not found

  /api/activities:
    get:
      summary: Get all activities
      responses:
        200:
          description: A list of all activities in the app
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activity'
    post:
      summary: Add an activity
      description: Add an activity to the app
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Activity'
      responses:
        201:
          description: The activity has been created

  /api/activities/{activity-id}:
    get:
      summary: Get an activity by ID
      parameters:
        - $ref: '#/components/parameters/ActivityIdPath'
      responses:
        200:
          description: The activity with the specified ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        404:
          description: Activity not found
    patch:
      summary: Update an activity by ID
      parameters:
        - $ref: '#/components/parameters/ActivityIdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Activity'
      responses:
        200:
          description: The activity has been updated
        404:
          description: Activity not found
    delete:
      summary: Delete an activity by ID
      parameters:
        - $ref: '#/components/parameters/ActivityIdPath'
      responses:
        204:
          description: The activity has been deleted
        404:
          description: Activity not found

components:
  parameters:
    UserIdPath:
      in: path
      name: user-id
      description: User id path parameter
      required: true
      schema:
        type: integer
        example: 3232
    ActivityIdPath:
      in: path
      name: activity-id
      description: Activity id path parameter
      required: true
      schema:
        type: integer
        example: 1
    EmailPath:
      in: path
      name: email
      description: User email path parameter
      required: true
      schema:
        type: string
        example: joe@soap.com
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 3232
        name:
          type: string
          example: Joe Soap
        email:
          type: string
          example: joe@soap.com
    Activity:
      type: object
      properties:
        id:
          type: integer
          example: 1
        description:
          type: string
          example: Walking
        duration:
          type: number
          example: 30.5
        calories:
          type: integer
          example: 200
        started:
          type: string
          format: date-time
          example: '2024-01-01T08:00:00.000Z'
        userId:
          type: integer
          example: 3232
